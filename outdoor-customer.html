let _banI=0;
// 자동 4초 롤링(스펙 기준) + 점(dot) 탭으로 수동 넘김 가능 · 수동 조작 시 4초 타이머 재시작
function goBanner(i){
  _banI=i;
  const sl=document.getElementById('banSlides'); if(!sl)return;
  sl.style.transform=`translateX(-${_banI*100}%)`;
  document.querySelectorAll('#banDots .mb-dot').forEach((d,k)=>d.classList.toggle('on',k===_banI));
  startBanner();   // 수동 넘김 후 4초 자동 롤링 재시작
}
function startBanner(){
  clearInterval(window._ban);
  window._ban=setInterval(()=>{
    const sl=document.getElementById('banSlides'); if(!sl){clearInterval(window._ban);return;}
    _banI=(_banI+1)%3; sl.style.transform=`translateX(-${_banI*100}%)`;
    document.querySelectorAll('#banDots .mb-dot').forEach((d,i)=>d.classList.toggle('on',i===_banI));
  },4000);
}

/* ── 매장 페이지 ── */
function scStore(){
  const s=store(S.curStore);
  const backBtn = S.mode==='group' ? `<button class="bk" onclick="go('home')">‹</button>` : '';
  const stClosed = (!s.open) || S.demoState==='closed';   // 영업 종료
  const stBreak = S.demoState==='break';                  // 브레이크 타임
  const stPaused = S.demoState==='paused' || (s.open && s.paused && S.demoState==='open'); // 영업 일시중지(준비중)
  const blocked = stClosed || stBreak || stPaused;        // 모두: 메뉴판만, 주문 불가
  const cats = [...new Set(s.menus.map(m=>m.cat||'메뉴'))];
  const activeCat = (S.storeCat && cats.includes(S.storeCat)) ? S.storeCat : cats[0];   // 카테고리 필터 — 실제 카테고리명으로 담긴 메뉴만 보여줌
  const hasCover = !!(s.cover && String(s.cover).trim());   // 커버 이미지 유무 → 정보 배치 분기
  // 영업 상태 요약(커버 오버레이·별도 정보 영역 공용)
  const st = stBreak ? {cls:'break', label:'브레이크 타임'}
    : stClosed ? {cls:'closed', label:'영업 종료'}
    : stPaused ? {cls:'break', label:'준비중 (영업 일시중지)'}
    : {cls:'open', label:'영업중'};
  // 대기 정보는 칩이 아니라 친절한 문장으로 안내 (영업 불가·off·값 없음이면 미표시)

        : (s.waitCount ? `지금 앞에 <b>${s.waitCount}</b>이 기다리고 있어요` : ''))

  // 매장 배너(335×56)는 위치 옵션 없이 커버 이미지 아래에 고정 노출
  const bannerHTML = `
    <!-- 매장 배너 (브랜드 공통 배너 → 매장 배너 순 롤링) -->

      <div class="sb-slide" style="background-image:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.62)),url('https://loremflickr.com/335/56/festival,foodtruck?lock=201')">
        <span class="sb-tag">브랜드</span>
        <div class="sb-txt">🎪 전 매장 공통 개장기념 이벤트 · 행사 기간 내내 전 부스 10% 할인</div>
      </div>
      <div class="sb-slide" style="background-image:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.62)),url('https://loremflickr.com/335/56/burger,food?lock=202')">
        <span class="sb-tag">매장</span>
        <div class="sb-txt">🎁 첫 주문 시 사이드 500원 할인 · ${s.name} 단독 혜택</div>

  return `

function mcardHTML(sid,m,closed){
  // 태그는 뉴트럴 통일, 색은 가격/할인(퍼시몬) 하나로만 — 시각적 정리
  const badgeMap={hot:['인기','hot'],new:['신메뉴','new'],rec:['추천','rec']};
  const badges = (m.badges||[]).map(b=>badgeMap[b]).filter(Boolean).map(([t,c])=>`<span class="m-tag ${c}">${t}</span>`).join('');
  let promo='', now=m.price, was='';
  if(m.hh){ promo='해피아워'; now=m.hhPrice; was=m.price; }
  else if(m.was){ was=m.was; }
  const price = `${promo?`<span class="m-promo">${promo}</span>`:''}<span class="m-now ${(promo||was)?'sale':''}">${won(now)}</span>${was?`<span class="m-was">${won(was)}</span>`:''}`;
  const rightVal = (m.left!=null ? {t:'남은 수량', n:m.left} : null);
  const lowStock = rightVal && rightVal.n<=5;   // 5개 이하 = 곧 품절 강조
  return `<button class="mcard ${m.soldout?'soldout':''}" onclick="openMenu('${sid}','${m.id}')">
    <div class="m-thumb" style="background-image:url('${m.photo||''}');background-size:cover;background-position:center;background-color:var(--bg)">${m.soldout?'<div class="so-dim">품절</div>':(m.left!=null&&m.left<=10?`<div class="m-thumb-tag">${m.left}개 남음</div>`:'')}</div>
    <div class="m-body">
      ${(badges || m.reuse)?`<div class="m-badges">${badges}${m.reuse?`<span class="m-reuse"><span class="mt-ic">♻️</span>다회용기</span>`:''}</div>`:''}

          ${(m.allergy||m.nutrition)?`<button class="d-info-btn" style="margin-top:0;flex-shrink:0" onclick="openMenuInfo()">메뉴 정보</button>`:''}

function addToCart(){

  // 개별 결제형: 다른 매장 메뉴를 담으면 기존 장바구니가 비워진다고 안내 후 교체
  if(S.payScope==='separate' && S.cart.length && S.cart[0].store!==S.curStore){

    return;
  }
  const base=m.hh?m.hhPrice:m.price;
  const listBase=m.was||m.price;   // 정가(할인 전) — 금액 요약 할인 세분화용

  toast('장바구니에 담았어요');

/* ── 장바구니 ── */
function scCart(){
  if(!S.cart.length) return `<div class="hdr"><button class="bk" onclick="back()">‹</button><div class="ht">장바구니</div></div>
    <div class="fullmsg"><div class="fm-ic">🛒</div><div class="fm-t">장바구니가 비어 있어요</div><div class="fm-b">메뉴를 담고 주문을 진행해 보세요</div><button class="fm-btn" onclick="go('store')">메뉴 보러 가기</button></div>`;
  const groups={};
  S.cart.forEach((c,i)=>{ (groups[c.store]=groups[c.store]||[]).push({...c,idx:i}); });
  const sum=S.cart.reduce((a,c)=>a+c.price*c.qty,0);
  const multi=Object.keys(groups).length>1;
  const showStoreH = S.payScope==='unified' || multi;  // 통합결제는 1개만 담아도 메뉴별 매장 표기
  return `
  <div class="hdr"><button class="bk" onclick="go('store')">‹</button><div class="ht">장바구니</div></div>
  <div class="scroll">
    ${S.payScope==='unified'
      ? `<div class="scope-note">🧺 여러 매장 상품을 한 번에 담아 결제할 수 있어요</div>`
      : `<div class="scope-note">🧺 한 매장씩 담아 매장별로 결제하는 방식이에요</div>`}
    <div class="sect">
      ${Object.entries(groups).map(([sid,items])=>`
        ${showStoreH?`<div class="store-group-h">🏪 ${store(sid).name}</div>`:''}
        ${items.map(c=>`<div class="citem">
          <div class="ci-th" style="background-image:url('${c.photo||''}');background-size:cover;background-position:center;background-color:var(--bg)">${c.photo?'':(c.img||'')}</div>
          <div class="ci-b">
            <div class="ci-n">${c.name} ${c.emoji||''}</div>
            <div class="ci-o">${c.opt}</div>
            <div class="ci-bot">
              <div class="stepper"><button onclick="chQty(${c.idx},-1)">−</button><b>${c.qty}</b><button onclick="chQty(${c.idx},1)">＋</button></div>
              <b>${won(c.price*c.qty)}</b>
            </div>
          </div>
          <button style="border:none;background:none;color:var(--ink4);font-size:18px;cursor:pointer;align-self:flex-start" onclick="delItem(${c.idx})">✕</button>
        </div>`).join('')}
      `).join('')}
    </div>
    <!-- 수령 방식 (서비스 유형은 브랜드 설정 · 고객 선택 아님) -->
    <div class="sect"><div class="sect-h">수령 방식</div>
      ${S.service==='delivery'
        ? `<div class="sect-sub">계신 자리로 스태프가 직접 가져다드려요.</div>
           <div class="deliver-fix">🛎️ 다음 화면에서 <b>받을 자리</b>를 입력해 주세요.</div>`
        : `<div class="seg">
             <button class="${S.pickup!=='reserve'?'on':''}" onclick="S.pickup='now';render()">바로 받기</button>
             <button class="${S.pickup==='reserve'?'on':''}" onclick="S.pickup='reserve';render()">예약하기</button>
           </div>
           ${S.pickup==='reserve' ? timePickerHTML()
             : `<div style="font-size:12.5px;color:var(--ink3);margin-top:10px">준비되면 부스에서 바로 픽업하는 방식이에요.</div>`}`}
    </div>
    ${(()=>{ const up=computeUpsell(); return up.length?`<div class="sect"><div class="sect-h">함께 담으면 좋아요</div>${up.map(({sid,m})=>upsellRow(sid,m,S.payScope==='unified')).join('')}</div>`:''; })()}
  </div>
  <div class="cta">
    <button class="cta-btn" onclick="tryCheckout()">${S.bill==='post'?'주문하기':'결제하기'} <span class="amt">${won(sum)}</span></button>
  </div>`;
}
// 결제하기 → 최소 주문 금액 미달이면 다음 화면으로 넘기지 않고 먼저 안내
function tryCheckout(){
  const mi=minInfo();
  const act = S.bill==='post' ? '주문' : '결제';
  if(mi.on && mi.below){
    if(mi.basis==='group'){
      toast(`${won(mi.min)} 이상 담으면 ${act}할 수 있어요.`);
    } else {
      toast(`매장별 ${won(mi.min)} 이상 담으면 ${act}할 수 있어요.`);
    }
    return;
  }
  S.agree={};   // 결제 진입 시 약관 동의 초기화(필수 동의 전 결제 버튼 비활성화)
  go('checkout');
}
// 담기/결제 방식은 브랜드·매장 설정 (고객 선택 아님) — 데모바에서 시뮬레이션
function setMinOrder(b){ S.minBasis=b; ['group','store','off'].forEach(k=>document.getElementById('min-'+k).classList.toggle('on',k===b)); render(); }
// 최소 주문 금액 판정 — 그룹(통합결제 총액) / 매장별 소계. 개별결제는 그룹 기준이 성립 안 되어 매장별로 적용.
function minInfo(){
  if(S.minBasis==='off') return {on:false};
  const GROUP_MIN=8000, STORE_MIN=5000;
  let basis=S.minBasis;
  if(basis==='group' && S.payScope==='separate') basis='store';
  if(basis==='group'){
    const total=S.cart.reduce((a,c)=>a+c.price*c.qty,0);
    return {on:true,basis:'group',label:'통합 결제 기준',min:GROUP_MIN,below:total<GROUP_MIN,shortfall:Math.max(0,GROUP_MIN-total)};
  }
  const bySt={}; S.cart.forEach(c=>{bySt[c.store]=(bySt[c.store]||0)+c.price*c.qty;});
  const shortStores=Object.keys(bySt).filter(sid=>bySt[sid]<STORE_MIN).map(sid=>({name:store(sid).name,need:STORE_MIN-bySt[sid]}));
  return {on:true,basis:'store',label:'매장별 기준',min:STORE_MIN,below:shortStores.length>0,shortStores};
}
// 서비스 유형(매장·브랜드 설정) — 포장 루트 / 자리로 받기(현장 배달) 루트. '배달' 설정 매장은 매장 그룹(통합 결제)에 편입될 수 없어 항상 개별 결제 단독 매장으로만 존재(고객 선택 아님, 자리입력 기본 Off)
function setService(v){
  S.service=v; if(v==='delivery') S.pickup='now';
  if(v==='delivery') S.payScope='separate'; // 배달 매장 = 통합 결제 옵션 자체가 없음
  ['pickup','delivery'].forEach(k=>document.getElementById('svc-'+k).classList.toggle('on',k===v));
  ['unified','separate'].forEach(k=>document.getElementById('scope-'+k).classList.toggle('on',k===S.payScope));
  document.getElementById('scope-unified').disabled = (v==='delivery');
  render();
}
function setScope(v){
  if(v==='unified' && S.service==='delivery') return; // 배달 매장은 통합 결제 선택 불가
  S.payScope=v;
  ['unified','separate'].forEach(k=>document.getElementById('scope-'+k).classList.toggle('on',k===v));
  if(v==='separate'){ // 개별 방식이면 서로 다른 매장 혼합분은 최근 매장만 남김
    const last=S.cart.length?S.cart[S.cart.length-1].store:null;
    if(last) S.cart=S.cart.filter(c=>c.store===last);
  }
  render();
}
function chQty(i,d){ S.cart[i].qty=Math.max(1,S.cart[i].qty+d); render(); }
function delItem(i){ S.cart.splice(i,1); render(); }
/* 업셀링: 매장이 '업셀링'으로 설정한 메뉴만 · 통합=전 매장 랜덤 노출(특정 매장 편중 방지) · 개별=해당 가맹점 메뉴만 */
function computeUpsell(){
  const inCart=new Set(S.cart.map(c=>c.menu));
  const sig=S.payScope+'|'+S.cart.map(c=>c.menu).sort().join(',');
  if(S._upsellSig===sig && S._upsellList) return S._upsellList;
  let pool=[];
  if(S.payScope==='separate' && S.cart.length){
    const sid=S.cart[0].store;
    store(sid).menus.forEach(m=>{ if(m.upsell&&!m.soldout&&!inCart.has(m.id)) pool.push({sid,m}); });
  } else {
    STORES.forEach(s=>{ if(!s.open) return; s.menus.forEach(m=>{ if(m.upsell&&!m.soldout&&!inCart.has(m.id)) pool.push({sid:s.id,m}); }); });
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }  // 랜덤 셔플
  }
  S._upsellSig=sig; S._upsellList=pool.slice(0,3);
  return S._upsellList;
}
function upsellRow(sid,m,showStore){
  const price = m.hh?m.hhPrice:m.price;
  return `<div class="citem" style="border:none;padding:10px 0">
    <div class="ci-th" style="background-image:url('${m.photo||''}');background-size:cover;background-position:center;background-color:var(--bg)">${m.photo?'':(m.img||'')}</div>
    <div class="ci-b"><div class="ci-n">${m.adult?'<span class="age-badge">19</span>':''}${m.name} ${m.emoji||''}</div><div class="ci-o">${showStore?store(sid).name+' · ':''}${won(price)}</div></div>
    <button class="ghostbtn" style="width:auto;margin:0;padding:0 15px;white-space:nowrap" onclick="openMenu('${sid}','${m.id}')">담기</button>
  </div>`;
}
/* 포장 예약: 시/분 직접 선택 (10분 단위, 내점형과 동일) · 매장 영업시간 밖·이미 지난 시간은 선택 불가 */
const pad2 = n => String(n).padStart(2,'0');
const fmtMin = t => `${pad2(Math.floor(t/60))}:${pad2(t%60)}`;
const nowMinutes = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
function validPickup(s,t){ return t>=s.ohStart && t<=s.ohEnd && t>=nowMinutes() && !(s.brkStart!=null && t>=s.brkStart && t<s.brkEnd); }
function pickHour(h){
  const s=store(S.curStore);
  if(h==null){ S.pickupH=null; S.pickupM=null; syncPickup(); render(); return; }
  S.pickupH=h;
  if(S.pickupM!=null && !validPickup(s,h*60+S.pickupM)) S.pickupM=null;   // 새 시간대에서 무효한 분 초기화
  syncPickup(); render();
}
function pickMin(m){
  const s=store(S.curStore);
  if(m==null){ S.pickupM=null; syncPickup(); render(); return; }
  if(S.pickupH==null || !validPickup(s,S.pickupH*60+m)) return;
  S.pickupM=m; syncPickup(); render();
}
function syncPickup(){ S.pickupTime = (S.pickupH!=null && S.pickupM!=null) ? `${pad2(S.pickupH)}:${pad2(S.pickupM)}` : null; }
// 내점형 QR메뉴판과 동일한 UX: 시/분 네이티브 select 드롭다운 2개 + 확정 안내 문구
function timePickerHTML(){
  const s=store(S.curStore);
  const now=nowMinutes();
  const startH=Math.floor(s.ohStart/60)-1, endH=Math.floor(s.ohEnd/60)+1;   // 영업시간 밖도 1시간씩 보여줘 '선택 불가' 인지
  const hourOk = h => { for(let m=0;m<60;m+=10){ if(validPickup(s,h*60+m)) return true; } return false; };
  // 이미 지난 시각(현재 시각 이전)은 선택지 자체에서 제외 · 영업시간 밖(아직 지나지 않음)은 '마감' 표시로 남겨둠
  const hours=[]; for(let h=Math.max(0,startH); h<=Math.min(23,endH); h++){ if(h*60+50>=now) hours.push(h); }
  const mins=[]; for(let m=0;m<60;m+=10){ if(S.pickupH==null || S.pickupH*60+m>=now) mins.push(m); }
  const hourOpts = hours.map(h=>`<option value="${h}" ${!hourOk(h)?'disabled':''} ${S.pickupH===h?'selected':''}>${h}시${hourOk(h)?'':' · 마감'}</option>`).join('');
  const minOpts = mins.map(m=>{const dis=(S.pickupH==null)||!validPickup(s,S.pickupH*60+m); return `<option value="${m}" ${dis?'disabled':''} ${S.pickupM===m?'selected':''}>${pad2(m)}분${dis?' · 마감':''}</option>`;}).join('');
  const brk = s.brkStart!=null ? ` · 브레이크 ${fmtMin(s.brkStart)}~${fmtMin(s.brkEnd)}` : '';
  return `
    <div class="tp-wrap">
      <div class="tp-label">수령 시간 <span class="req">필수</span></div>
      <div class="tp-selrow">
        <select class="timesel" onchange="pickHour(this.value===''?null:Number(this.value))">
          <option value="" ${S.pickupH==null?'selected':''}>시</option>
          ${hourOpts}
        </select>

const COUPONS = [
  { id:'CP001', name:'개장기념 감사 쿠폰',       scope:'group',  type:'amount', value:1000, minOrder:8000, desc:'전체 주문 8,000원 이상 시 1,000원 할인' },
  { id:'CP002', name:'음료 10% 할인',            scope:'group',  type:'rate',   value:10, maxDisc:3000, minOrder:0, desc:'전체 주문 최대 3,000원 할인' },
  { id:'CP003', name:'소프트버거 트럭 단독 할인', scope:'burger', type:'amount', value:2000, minOrder:5000, desc:'이 매장 5,000원 이상 시 2,000원 할인' },
];
const COUPON_CODES = { 'HELLO2026':'CP001', 'SOFT10':'CP002', 'BURGER2000':'CP003' };
function cartSum(){ return S.cart.reduce((a,c)=>a+c.price*c.qty,0); }
function storeSum(sid){ return S.cart.filter(c=>c.store===sid).reduce((a,c)=>a+c.price*c.qty,0); }
function couponBase(cp){ return cp.scope==='group' ? cartSum() : storeSum(cp.scope); }
function couponAmt(cp){ const base=couponBase(cp); if(base<=0||base<cp.minOrder) return 0;
  if(cp.type==='amount') return Math.min(cp.value,base);
  if(cp.type==='rate') return Math.min(Math.round(base*cp.value/100), cp.maxDisc||Infinity);
  return 0; }
function selectedCoupons(){ return Object.values(S.selCoupons||{}).filter(Boolean).map(id=>COUPONS.find(c=>c.id===id)).filter(Boolean); }
function couponDiscount(){ return selectedCoupons().reduce((a,cp)=>a+couponAmt(cp),0); }
function applyCode(){
  const code=(S.couponCode||'').trim().toUpperCase();
  if(!code) return toast('쿠폰 코드를 입력해 주세요');

  if(!cp) return toast('유효하지 않거나 만료된 쿠폰 코드예요');

}

}
const ST_BADGE = {'준비완료':'st-done','배달중':'st-done','준비중':'st-cook','주문요청':'st-cook','수령완료':'st-pick','주문취소':'st-rej'};
// 액션 우선 정렬 — 지금 받으러 가야 하는 건이 항상 맨 위 (정책 › 통합결제 회차별 보드와 동일 기준)
const ACT_ORDER = {'준비완료':0,'배달중':1,'준비중':2,'주문요청':3,'수령완료':4,'주문취소':5};
const byAction = list => list.map((p,i)=>[p,i]).sort((a,b)=>(ACT_ORDER[a[0].status]??9)-(ACT_ORDER[b[0].status]??9)||a[1]-b[1]).map(x=>x[0]);
// 단계 필터 — 선택 단계의 상태 매칭(준비완료는 배달중까지 포함)
const stageMatch = (status, stage) => stage==='준비완료' ? (status==='준비완료'||status==='배달중') : status===stage;
// 셀 탭 → 그 단계만 보기 / 같은 셀 다시 탭 → 전체 보기
function setHistStage(st){ S.histStage = (S.histStage===st ? null : st); render(); }
// 선택 단계에 해당하는 매장만 남겨 회차를 재구성(없으면 그 회차는 제외) · 합계·상태 재계산
function applyStageFilter(P, stage){
  if(!stage) return P;
  return P.map(p=>{
    const stores = p.stores.filter(s=>stageMatch(s.status, stage));
    if(!stores.length) return null;
    const items = stores.flatMap(s=>s.items.map(it=>({...it,store:s.sid})));
    return {...p, stores, items, status: byAction(stores)[0].status};
  }).filter(Boolean);
}
// 상단 요약 겸 필터 — 매장 단위로 각 단계 곳 수를 집계, 셀을 탭하면 그 단계 주문만 모아 봄
// 주문취소는 상시 노출이 아니라, 취소 건이 있을 때만 '수령완료' 오른쪽 셀로 덧붙음
function stageSummaryHTML(P){
  const units=[]; P.forEach(p=>p.stores.forEach(s=>units.push(s.status)));
  const cnt = st => units.filter(x=>x===st).length;
  const cell = (key, n, extraCls) => {
    const tap=n>0, sel=S.histStage===key;
    const lbl=(key==='준비완료'&&S.service==='delivery')?'배달중':key;
    return `<div class="oh-stage-cell ${n?extraCls:''} ${tap?'tap':''} ${sel?'sel':''}"${tap?` onclick="setHistStage('${key}')"`:''}>
      <span class="oh-stage-n">${n}</span><span class="oh-stage-lbl">${lbl}</span></div>`;
  };
  let cells = HIST_STEPS.map(st=>cell(st, st==='준비완료'?cnt('준비완료')+cnt('배달중'):cnt(st), st==='준비완료'?'on ready':'on')).join('');
  const canceled = cnt('주문취소');
  if(canceled) cells += cell('주문취소', canceled, 'on cancel');   // 취소가 있을 때만 노출
  const cur = S.histStage;
  const curLbl = (cur==='준비완료'&&S.service==='delivery')?'배달중':cur;
  const hint = cur
    ? `<div class="oh-stage-hint"><b>${curLbl}</b> 단계만 보는 중 · 다시 누르면 전체가 보여요</div>`
    : '';
  return `<div class="oh-lead">
    <div class="oh-stage">${cells}</div>
    ${hint}
  </div>`;
}

/* ── 내 주문 내역 (핵심 정보만 메인 · 보조 정보는 접기 · 회차별/매장별 동일 카드) ── */
function scHistory(){
  const unified = S.payScope==='unified';
  // 기본은 회차별 · 통합결제일 때만 '매장별로 모아보기'를 켜서 같은 목록을 매장 기준으로 다시 묶을 수 있음
  // (개별결제는 한 회차 = 한 매장이라 회차별 목록에 이미 매장이 그대로 드러나므로 전환 옵션 자체가 없음)
  const view = (unified && S.histByStore) ? 'store' : 'round';
  const Pfull = getPayments().slice().sort((a,b)=>b.round-a.round);   // 최신 회차가 맨 위
  const P = applyStageFilter(Pfull, S.histStage);                     // 단계 필터 적용(전체면 그대로)
  let body='';

  if(view==='round'){
    body = P.map(p=>roundCardHTML(p,true)).join('');
  } else {
    // 매장별 — 회차를 매장 단위로 쪼개서(각 매장의 자기 상태로) 매장 섹션 헤더 아래 같은 카드를 나열
    const byStore={};
    P.forEach(p=>p.stores.forEach(s=>{
      (byStore[s.sid]=byStore[s.sid]||[]).push({...p, stores:[s], items:s.items.map(it=>({...it,store:s.sid})), status:s.status});
    }));
    body = Object.entries(byStore).map(([sid,pays])=>{
      const stTotal = pays.reduce((a,p)=>a+payTotal(p),0);
      return `<div class="store-group-h" style="justify-content:space-between;margin:16px 14px 0">
        <span>${store(sid).logo} ${store(sid).name}${store(sid).loc?` <span class="oh-st-loc">${PIN}${store(sid).loc}</span>`:''}</span><span>${won(stTotal)}</span>
      </div>
      ${pays.map(p=>roundCardHTML(p,false)).join('')}`;
    }).join('');
  }
  const grand = Pfull.reduce((a,p)=>a+payTotal(p),0);   // 누적 전체 합계는 필터와 무관하게 전체 기준
  return `
  <div class="hdr"><button class="bk" onclick="go(S.mode==='group'?'home':'store')">‹</button><div class="ht">주문 내역</div></div>
  <div class="scroll">
    ${stageSummaryHTML(Pfull)}
    ${unified
      ? `<button class="oh-viewtog ${view==='store'?'on':''}" onclick="S.histByStore=!S.histByStore;render()">
          <span class="chk ${view==='store'?'on':''}">${view==='store'?'✓':''}</span>
          <span>매장별로 모아보기</span>
        </button>`
      : ''}
    ${body}
    <div class="oh-tail">
      <div class="oh-tail-row"><span>전체 합계 (누적)</span><b>${won(grand)}</b></div>
      <div class="oh-tail-note">취소·환불 건은 합계에서 제외돼요</div>
    </div>
    <div style="height:24px"></div>
  </div>`;
}
/* ── 전자영수증 ── */
function openReceipt(id){
  const p=getPayments().find(x=>x.id===id); if(!p)return;
  const canceled=p.status==='주문취소';
  const groups=grpByStore(p.items);
  const sub=sumItems(p.items);
  const coupon = canceled?0:1000;               // 데모: 취소건은 쿠폰 미적용 가정
  const total=Math.max(0,sub-coupon);
  S._rcId=id;
  const hide=!!S.rcHide;
  const pay=p.pay||'';
  // 결제수단 마스킹 — 카드: BIN 6 + 뒤 4(가운데 마스킹) · 간편결제: 결제수단명 + 승인번호
  const payMasked = pay.includes('페이') ? `${pay} · 승인번호 18674347` : `${pay} · 123456-**-****-1234`;
  document.getElementById('receiptInner').innerHTML = `
    <div class="ms-grab"><span></span></div>
    <button class="ms-close" onclick="closeReceipt()">✕</button>
    <div class="rc-scroll">
      <div class="rc-topbar"><button class="rc-hidebtn" onclick="toggleRcHide()">${hide?'주문 내역 보기':'주문 내역 가리기'}</button></div>
      <div class="rc-badge ${canceled?'cancel':''}">${canceled?'취소 전자영수증':'전자영수증'}</div>
      <div class="rc-title">${canceled?'주문이 취소되었어요':'결제가 완료되었어요'}</div>
      <div class="rc-meta">주문번호 <b>${p.id}</b><br>결제일시 ${p.paidAt}${canceled?`<br><span class="rc-cancel-at">취소일시 ${p.canceledAt}</span>`:''}</div>
      <div class="rc-hr"></div>
      ${hide
        ? ``
        : `${Object.entries(groups).map(([sid,items])=>`
            <div class="rc-store">${store(sid).logo} ${store(sid).name}</div>
            ${items.map(it=>`<div class="rc-line"><span>${it.name}${it.opt?' · '+it.opt:''} ×${it.qty}</span><span>${won(it.price*it.qty)}</span></div>`).join('')}
          `).join('')}
          <div class="rc-hr"></div>
          <div class="rc-line"><span>상품 합계</span><span>${won(sub)}</span></div>
          ${coupon?`<div class="rc-line"><span>쿠폰 할인</span><span>−${won(coupon)}</span></div>`:''}`}
      <div class="rc-line rc-total"><span>${canceled?'환불 예정 금액':'결제금액'}</span><span>${won(total)}</span></div>
      <div class="rc-line dim"><span>결제수단</span><span>${payMasked}</span></div>
      ${canceled?`<div class="rc-cancelbox"><div class="cn-main">↩️ ${p.cancelMain}</div><div class="cn-sub">${p.cancelSub}</div></div>`:''}
      <div class="rc-hr"></div>
      ${Object.keys(groups).map(sid=>{const i=store(sid).info||{};return `<div class="rc-biz">
        <div class="rc-biz-h">${store(sid).name}</div>
        <div class="rc-biz-row">사업자등록번호 ${i.regno||'-'}</div>
        ${i.address?`<div class="rc-biz-row">${i.address}</div>`:''}
      </div>`;}).join('')}
      <div class="rc-barcode"><div class="rc-bars"></div><div class="rc-bc-no">${p.id} · 8801234 567890</div></div>
      <div class="rc-actions">
        <button class="rc-act" onclick="toast('영수증 이미지를 저장했어요')">영수증 저장</button>
        ${canceled?'':`<button class="rc-act naver" onclick="toast('네이버 영수증 리뷰로 이동','MY플레이스 영수증 인증 화면으로 연결돼요')">네이버 리뷰 남기기</button>`}
      </div>
      <div class="rc-foot">전자영수증은 발송일로부터 <b>1년</b>까지 확인할 수 있어요 · 거래 기록은 관련 법령에 따라 보관돼요.<br>본 영수증은 전자적으로 발행된 거래 확인 내역이에요 · 세금계산서·현금영수증과는 별개예요. 고객 정보(이름·연락처)는 표기하지 않아요.${canceled?'<br>취소된 거래는 네이버 영수증 리뷰를 작성할 수 없어요.':''}</div>
    </div>`;
  document.getElementById('receiptModal').classList.add('on'); syncBgLock();
}
function toggleRcHide(){ S.rcHide=!S.rcHide; openReceipt(S._rcId); }
function closeReceipt(){ const el=document.getElementById('receiptModal'); if(el){ el.classList.remove('on'); syncBgLock(); } }

/* ── 상황 전체화면 공통 ── */
function full(ic,t,b,btn,target,note){
  return `<div class="hdr"><div class="ht" style="flex:1;text-align:center">알림</div></div>
  <div class="fullmsg">
    <div class="fm-ic">${ic}</div>
    <div class="fm-t">${t}</div>
    <div class="fm-b">${b}</div>
    <button class="fm-btn" onclick="go('${target}')">${btn}</button>
    ${note?`<div class="fm-note">${note}</div>`:''}
  </div>`;
}
function back(){ go(S.mode==='group'?'home':'store'); }

/* ══════════════ 시작 ══════════════ */
restart();
</script>
